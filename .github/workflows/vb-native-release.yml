name: Build and release KAOSDUO Native VB.NET v6.0.0
# Historical v6.0.0 release workflow. Maintained for manual rebuilds only.
# Do not overwrite the older release whenever source changes.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and compile Visual Basic project
        run: |
          dotnet restore src/KAOSDUO.VB/KAOSDUO.VB.vbproj -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/KAOSDUO.VB/KAOSDUO.VB.vbproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run headless VB.NET rule and save tests
        run: |
          dotnet 'src/KAOSDUO.VB/bin/Release/net8.0-windows/win-x64/KAOSDUO.dll' --self-test
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "$env:TEMP/kaosduo_selftest_error.txt") { Get-Content "$env:TEMP/kaosduo_selftest_error.txt" }
            throw 'VB.NET rules self-test failed'
          }
      - name: Build single-file native Windows executable
        run: |
          dotnet publish src/KAOSDUO.VB/KAOSDUO.VB.vbproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o release/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path release/win-x64/KAOSDUO.exe)) { throw 'Executable missing' }
          New-Item -ItemType Directory -Path release/packages -Force | Out-Null
          Compress-Archive -Path release/win-x64/* -DestinationPath release/packages/KAOSDUO_REFORGED_v6.0.0_WIN64.zip -Force
          Compress-Archive -Path src/KAOSDUO.VB, BUILD_WINDOWS.bat, README.md, RELEASE_NOTES_V6.md -DestinationPath release/packages/KAOSDUO_REFORGED_v6.0.0_SOURCE.zip -Force
          $files = Get-ChildItem release/packages/*.zip
          $sums = foreach ($file in $files) { "$( (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() ) *$($file.Name)" }
          $sums | Set-Content release/packages/SHA256SUMS_v6.0.0.txt
      - name: Create verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release/packages/* | ForEach-Object { $_.FullName })
          if (gh release view v6.0.0 --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload v6.0.0 @assets --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create v6.0.0 @assets --title 'KAOSDUO: REFORGED v6.0.0 (Native Visual Basic .NET)' --notes-file RELEASE_NOTES_V6.md --latest --target "$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
