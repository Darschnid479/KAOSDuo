name: Publish OVERDRIVE v2.0.0 Release

on:
  push:
    branches: [main]
    paths:
      - 'dist/KAOSDUO_OVERDRIVE_v2.0.0.html'
      - 'dist/KAOSDUO_OVERDRIVE_v2.0.0_OFFLINE.zip'
      - '.github/workflows/release.yml'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          html=Path('dist/KAOSDUO_OVERDRIVE_v2.0.0.html').read_text()
          assert 'MAX_WAVES=10' in html
          assert 'data:image/webp;base64' in html
          assert 'OVERDRIVE' in html
          with zipfile.ZipFile('dist/KAOSDUO_OVERDRIVE_v2.0.0_OFFLINE.zip') as z:
              assert 'KAOSDUO_OVERDRIVE_v2.0.0.html' in z.namelist()
          print('Offline release artifacts validated')
          PY
      - name: Generate SHA-256 checksums
        run: sha256sum dist/KAOSDUO_OVERDRIVE_v2.0.0.html dist/KAOSDUO_OVERDRIVE_v2.0.0_OFFLINE.zip > dist/SHA256SUMS.txt
      - name: Create or update release v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.0.0 dist/KAOSDUO_OVERDRIVE_v2.0.0.html dist/KAOSDUO_OVERDRIVE_v2.0.0_OFFLINE.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v2.0.0 dist/KAOSDUO_OVERDRIVE_v2.0.0.html dist/KAOSDUO_OVERDRIVE_v2.0.0_OFFLINE.zip dist/SHA256SUMS.txt --title "KAOSDUO: OVERDRIVE v2.0.0" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          fi