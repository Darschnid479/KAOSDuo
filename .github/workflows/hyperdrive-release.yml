name: Publish KAOSDUO HYPERDRIVE v4.0.0
on:
  push:
    branches: [main]
    paths:
      - 'dist/KAOSDUO_HYPERDRIVE_v4.0.0.html'
      - 'dist/KAOSDUO_HYPERDRIVE_v4.0.0_OFFLINE.zip'
      - '.github/workflows/hyperdrive-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        run: |
          python3 - <<'PYVALIDATE'
          from pathlib import Path
          from zipfile import ZipFile
          h=Path('dist/KAOSDUO_HYPERDRIVE_v4.0.0.html').read_text()
          assert 'function updatePortalRun(dt)' in h and 'startPortalMiniBoss' in h
          assert 'WEAPONS=[' in h and 'data:image/webp;base64,' in h
          assert '../assets/' not in h
          with ZipFile('dist/KAOSDUO_HYPERDRIVE_v4.0.0_OFFLINE.zip') as z:
              assert z.testzip() is None
              assert 'KAOSDUO_HYPERDRIVE_v4.0.0.html' in z.namelist()
          PYVALIDATE
      - name: Checksums
        run: |
          cd dist
          sha256sum KAOSDUO_HYPERDRIVE_v4.0.0.html KAOSDUO_HYPERDRIVE_v4.0.0_OFFLINE.zip > SHA256SUMS_v4.0.0.txt
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v4.0.0 dist/KAOSDUO_HYPERDRIVE_v4.0.0.html dist/KAOSDUO_HYPERDRIVE_v4.0.0_OFFLINE.zip dist/SHA256SUMS_v4.0.0.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v4.0.0 dist/KAOSDUO_HYPERDRIVE_v4.0.0.html dist/KAOSDUO_HYPERDRIVE_v4.0.0_OFFLINE.zip dist/SHA256SUMS_v4.0.0.txt --title 'KAOSDUO: HYPERDRIVE v4.0.0' --notes-file RELEASE_NOTES.md --latest --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
